name: Build and Deploy ASP.NET Core App to Azure

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore Library-backend/Library/Library.sln

      - name: Build project
        run: dotnet build Library-backend/Library/Library.sln --configuration Release --no-restore

      - name: Publish project
        run: dotnet publish Library-backend/Library/Library.sln --configuration Release --output ./publish --no-restore

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: "ProjectLibrary"
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./Library-backend/Library/publish
