name: Build and Deploy ASP.Net Core + React to Azure Web App

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # --- Build .NET API ---
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build API
        run: dotnet build Library-backend/Library/Library/Library.csproj --configuration Release

      - name: Publish API
        run: dotnet publish Library-backend/Library/Library/Library.csproj -c Release -o ${{ github.workspace }}/publish

      # --- Build React frontend ---
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install frontend dependencies
        run: |
          cd Library-frontend
          npm install

      - name: Build frontend
        run: |
          cd Library-frontend
          npm run build

      # --- Copy frontend build to wwwroot ---
      - name: Copy frontend to wwwroot
        shell: pwsh
        run: |
          $wwwroot = "${{ github.workspace }}/publish/wwwroot"
          New-Item -ItemType Directory -Force -Path $wwwroot
          Copy-Item -Path "${{ github.workspace }}/Library-frontend/dist/*" -Destination $wwwroot -Recurse -Force

      # --- Upload artifact ---
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ${{ github.workspace }}/publish

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B409F5CD8EFE4E76A334426525DCAE66 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7536B0C628BA4CA784DBC2916F973121 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4D7728DCE9094559AFF4C2927C53A0CB }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TeamProjectLibrary'
          slot-name: 'Production'
          package: ${{ github.workspace }}/publish
