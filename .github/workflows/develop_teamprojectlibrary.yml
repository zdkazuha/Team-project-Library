name: Build and Deploy ASP.Net Core + React to Azure Web App

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # --- Build Web API ---
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'
      - name: Build Web API
        run: dotnet build Library-backend/Library/Library.csproj --configuration Release
      - name: Publish Web API
        run: dotnet publish Library-backend/Library/Library.csproj -c Release -o ./publish

      # --- Build React frontend ---
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: Install frontend dependencies
        run: |
          cd Library-frontend
          npm install
      - name: Build React frontend
        run: |
          cd Library-frontend
          npm run build
      - name: Copy React build to wwwroot
        run: |
          mkdir -p ./publish/wwwroot
          cp -r Library-frontend/build/* ./publish/wwwroot/

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B409F5CD8EFE4E76A334426525DCAE66 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7536B0C628BA4CA784DBC2916F973121 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4D7728DCE9094559AFF4C2927C53A0CB }}
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TeamProjectLibrary'
          slot-name: 'Production'
          package: ./publish
